<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Composio Tool Dependency Graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --border: #2a2f38;
    --text: #e6e9ef;
    --muted: #8a92a3;
    --accent: #5b9dff;
    --good: #3ecf8e;
    --warn: #f0a84e;
    --gh: #a882f2;
    --gs: #5b9dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--border); padding: 14px; overflow-y: auto; }
  #sidebar h1 { font-size: 15px; margin: 0 0 4px; }
  #sidebar .sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  #search { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: #0c0f13; color: var(--text); font-size: 13px; margin-bottom: 10px; }
  .filter-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; color: var(--text); }
  .legend { font-size: 11px; color: var(--muted); margin-top: 14px; line-height: 1.7; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #stats { font-size: 11px; color: var(--muted); margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  #network { flex: 1; position: relative; }
  #panel { width: 380px; flex: none; background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: none; }
  #panel.open { display: block; }
  #panel h2 { font-size: 14px; margin: 0 0 2px; }
  #panel .toolkit-tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; }
  #panel .desc { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .field-block { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .field-name { font-size: 12px; font-weight: 600; }
  .field-desc { font-size: 11px; color: var(--muted); margin: 3px 0 6px; }
  .precursor { font-size: 11px; padding: 4px 6px; background: #0c0f13; border-radius: 4px; margin-top: 4px; cursor: pointer; }
  .precursor:hover { outline: 1px solid var(--accent); }
  .precursor .conf { color: var(--muted); }
  .user-input-badge { font-size: 10px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 5px; display: inline-block; margin-top: 4px; }
  #closePanel { float: right; cursor: pointer; color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Composio Tool Dependency Graph</h1>
    <div class="sub" id="metaLine">__META_LINE__</div>
    <input id="search" type="text" placeholder="Search tools by name or slug…" />
    <div class="filter-row"><label><input type="checkbox" id="fGooglesuper" checked /> Google Super</label></div>
    <div class="filter-row"><label><input type="checkbox" id="fGithub" checked /> GitHub</label></div>
    <div class="filter-row"><label><input type="checkbox" id="fHideIsolated" checked /> Hide nodes with no edges</label></div>
    <div class="filter-row"><label><input type="checkbox" id="fOnlyUserInput" /> Only nodes needing user input</label></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--gs)"></span>Google Super tool</div>
      <div><span class="dot" style="background:var(--gh)"></span>GitHub tool</div>
      <div><span class="dot" style="background:var(--good); border:2px solid var(--good)"></span>Fully resolvable (every required field has a precursor)</div>
      <div><span class="dot" style="background:transparent; border:2px solid var(--warn)"></span>Has ≥1 field needing user input</div>
      <div>Edge = "output of A supplies a required input of B", labeled by field name. Click a node for full detail + its precursor chain.</div>
    </div>
    <div id="stats"></div>
  </div>
  <div id="network"></div>
  <div id="panel">
    <span id="closePanel">✕ close</span>
    <div id="panelBody"></div>
  </div>
</div>
<script>
const GRAPH = __GRAPH_DATA__;

const TOOLKIT_COLOR = { googlesuper: "#5b9dff", github: "#a882f2" };

const nodesById = new Map(GRAPH.nodes.map(n => [n.id, n]));
const edgesByTo = new Map();
const edgesByFrom = new Map();
for (const e of GRAPH.edges) {
  (edgesByTo.get(e.to) ?? edgesByTo.set(e.to, []).get(e.to)).push(e);
  (edgesByFrom.get(e.from) ?? edgesByFrom.set(e.from, []).get(e.from)).push(e);
}
const connected = new Set();
for (const e of GRAPH.edges) { connected.add(e.from); connected.add(e.to); }

const allNodes = GRAPH.nodes.map(n => ({
  id: n.id,
  label: n.name.length > 28 ? n.name.slice(0, 26) + "…" : n.name,
  title: n.id,
  color: {
    background: TOOLKIT_COLOR[n.toolkit] ?? "#888",
    border: n.hasUserInputFields ? "#f0a84e" : (n.fullyResolvable ? "#3ecf8e" : TOOLKIT_COLOR[n.toolkit]),
  },
  borderWidth: n.fullyResolvable || n.hasUserInputFields ? 3 : 1,
  shape: "dot",
  size: 8 + Math.min(10, (edgesByFrom.get(n.id)?.length ?? 0)),
  font: { color: "#c9cfda", size: 11 },
}));
const allEdges = GRAPH.edges.map(e => ({
  id: e.id, from: e.from, to: e.to, label: e.field,
  arrows: "to",
  color: { color: "#3a4150", opacity: 0.55, highlight: "#5b9dff" },
  font: { size: 9, color: "#8a92a3", strokeWidth: 0, align: "middle" },
  width: 1 + e.confidence,
  smooth: { type: "dynamic" },
}));

const nodesDS = new vis.DataSet([]);
const edgesDS = new vis.DataSet([]);

const container = document.getElementById("network");
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: { barnesHut: { gravitationalConstant: -4000, springLength: 90, springConstant: 0.02 }, stabilization: { iterations: 200 } },
  interaction: { hover: true, tooltipDelay: 100 },
  layout: { improvedLayout: GRAPH.nodes.length < 800 },
});

function applyFilters() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const showGs = document.getElementById("fGooglesuper").checked;
  const showGh = document.getElementById("fGithub").checked;
  const hideIsolated = document.getElementById("fHideIsolated").checked;
  const onlyUserInput = document.getElementById("fOnlyUserInput").checked;

  const visibleIds = new Set();
  for (const n of GRAPH.nodes) {
    if (n.toolkit === "googlesuper" && !showGs) continue;
    if (n.toolkit === "github" && !showGh) continue;
    if (hideIsolated && !connected.has(n.id)) continue;
    if (onlyUserInput && !n.hasUserInputFields) continue;
    if (q && !(n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))) continue;
    visibleIds.add(n.id);
  }
  nodesDS.clear();
  nodesDS.add(allNodes.filter(n => visibleIds.has(n.id)));
  edgesDS.clear();
  edgesDS.add(allEdges.filter(e => visibleIds.has(e.from) && visibleIds.has(e.to)));

  document.getElementById("stats").textContent =
    `${visibleIds.size} / ${GRAPH.nodes.length} tools shown · ${edgesDS.length} edges · generated ${new Date(GRAPH.meta.generatedAt).toLocaleString()}`;
}

["search", "fGooglesuper", "fGithub", "fHideIsolated", "fOnlyUserInput"].forEach(id => {
  document.getElementById(id).addEventListener("input", applyFilters);
});
applyFilters();

function escapeHtml(s) {
  return (s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderPanel(nodeId) {
  const n = nodesById.get(nodeId);
  if (!n) return;
  const color = TOOLKIT_COLOR[n.toolkit] ?? "#888";
  let html = `<h2>${escapeHtml(n.name)}</h2>`;
  html += `<div class="toolkit-tag" style="background:${color}22;color:${color}">${n.toolkit}</div>`;
  html += `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">${escapeHtml(n.id)}</div>`;
  html += `<div class="desc">${escapeHtml(n.description)}</div>`;

  if (n.requiredFields.length === 0) {
    html += `<div class="desc">No required input fields.</div>`;
  }
  for (const f of n.requiredFields) {
    html += `<div class="field-block"><div class="field-name">${escapeHtml(f.field)} <span style="color:var(--muted);font-weight:400">(${escapeHtml(f.type)})</span></div>`;
    if (f.description) html += `<div class="field-desc">${escapeHtml(f.description)}</div>`;
    for (const p of f.precursors) {
      html += `<div class="precursor" data-jump="${escapeHtml(p.producerTool)}">← <b>${escapeHtml(p.producerTool)}</b>.${escapeHtml(p.outputField)} <span class="conf">(${p.source}, conf ${p.confidence.toFixed(2)})</span></div>`;
    }
    if (f.userInput) html += `<div class="user-input-badge">needs user input</div>`;
    html += `</div>`;
  }

  const consumers = edgesByFrom.get(nodeId) ?? [];
  if (consumers.length > 0) {
    html += `<h2 style="margin-top:16px">Feeds into (${consumers.length})</h2>`;
    for (const e of consumers.slice(0, 20)) {
      html += `<div class="precursor" data-jump="${escapeHtml(e.to)}">→ <b>${escapeHtml(e.to)}</b>.${escapeHtml(e.field)}</div>`;
    }
    if (consumers.length > 20) html += `<div class="desc">+ ${consumers.length - 20} more</div>`;
  }

  document.getElementById("panelBody").innerHTML = html;
  document.getElementById("panel").classList.add("open");
  document.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => selectAndFocus(el.dataset.jump));
  });
}

/** Backward BFS from a node over precursor edges, to highlight its full chain. */
function highlightChain(nodeId) {
  const visitedNodes = new Set([nodeId]);
  const visitedEdges = new Set();
  const queue = [nodeId];
  while (queue.length) {
    const cur = queue.shift();
    for (const e of edgesByTo.get(cur) ?? []) {
      visitedEdges.add(e.id);
      if (!visitedNodes.has(e.from)) { visitedNodes.add(e.from); queue.push(e.from); }
    }
  }
  const updates = [];
  edgesDS.forEach(e => {
    updates.push({ id: e.id, color: visitedEdges.has(e.id)
      ? { color: "#5b9dff", opacity: 1 }
      : { color: "#3a4150", opacity: 0.12 } });
  });
  edgesDS.update(updates);
  const nodeUpdates = [];
  nodesDS.forEach(n => {
    nodeUpdates.push({ id: n.id, opacity: visitedNodes.has(n.id) ? 1 : 0.15 });
  });
  nodesDS.update(nodeUpdates);
}

function clearHighlight() {
  edgesDS.forEach(e => edgesDS.update({ id: e.id, color: { color: "#3a4150", opacity: 0.55 } }));
  nodesDS.forEach(n => nodesDS.update({ id: n.id, opacity: 1 }));
}

function selectAndFocus(nodeId) {
  if (!nodesDS.get(nodeId)) return; // filtered out
  network.selectNodes([nodeId]);
  network.focus(nodeId, { scale: 1.1, animation: true });
  renderPanel(nodeId);
  highlightChain(nodeId);
}

network.on("click", (params) => {
  if (params.nodes.length > 0) {
    selectAndFocus(params.nodes[0]);
  } else {
    document.getElementById("panel").classList.remove("open");
    clearHighlight();
  }
});
document.getElementById("closePanel").addEventListener("click", () => {
  document.getElementById("panel").classList.remove("open");
  clearHighlight();
});
</script>
</body>
</html>
